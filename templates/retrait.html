{% extends 'base.html' %}
{% block title %}Retrait{% endblock %}
{% block content %}
<div class="form-card">
    <div class="section-title">Effectuer un retrait</div>
    <form method="POST">
        <div class="form-group">
            <label>Compte</label>
            <select name="numero" required>
                <option value="">-- Sélectionner un compte --</option>
                {% for c in comptes %}
                <option value="{{ c.numero }}">{{ c.numero }} – {{ c.titulaire }} ({{ "%.2f"|format(c.solde) }} DA)</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Montant (DA)</label>
            <input type="number" name="montant" placeholder="0.00" min="1" step="0.01" required>
        </div>
        <button type="submit" class="btn">Retirer</button>
    </form>
</div>
{% endblock %}
